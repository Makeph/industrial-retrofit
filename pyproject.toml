[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-retrofit"
version = "0.1.0"
description = "Give a legacy machine a modern data voice: Modbus registers -> clean telemetry, predictive-maintenance anomaly detection and live OEE."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["industry-4.0", "retrofit", "modbus", "oee", "predictive-maintenance",
            "iiot", "automation", "telemetry"]
dependencies = []

[project.optional-dependencies]
plc = ["pymodbus>=3.0"]
assets = ["pillow>=10", "numpy>=1.24", "imageio[ffmpeg]>=2.30"]
dev = ["pytest>=7"]

[project.scripts]
retrofit = "retrofit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
